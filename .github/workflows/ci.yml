name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Validation tests (including the layering rules)
        run: ctest --test-dir build --output-on-failure
      - name: Backends in this build
        run: build/owe backends cpu
      - name: Smoke-render every scene
        run: |
          for s in scenes/*.owe; do
            build/owe render "$s" --spp 1 --resolution 64x48 --out "build/$(basename "$s" .owe)"
          done
      - name: Throughput and image digests on the canonical suite
        run: build/owe bench --spp 2 --resolution 64x48

  # The GPU backend on a software Vulkan device (Mesa lavapipe): the kernels run the conformance
  # suite and are tested statistically against the CPU reference on an independent Vulkan driver.
  gpu-linux-lavapipe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libvulkan1 mesa-vulkan-drivers
      - name: Configure (fetches Vulkan-Headers, volk and slangc)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOWE_GPU=ON
      - name: Build
        run: cmake --build build
      - name: Devices
        run: build/owe backends || true
      - name: Tests (the conformance suite runs on lavapipe when it is usable, else gpu is skipped)
        run: ctest --test-dir build --output-on-failure
      - name: GPU against CPU on a scene
        run: |
          if build/owe backends gpu; then
            build/owe compare scenes/glass_of_water.owe:Eye --backend gpu --spp 16 --runs 6 --resolution 32x24
          fi

  # Apple silicon: the GPU backend through MoltenVK.
  gpu-macos-moltenvk:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and MoltenVK
        run: brew install ninja molten-vk vulkan-loader sdl3
      - name: Configure (fetches Vulkan-Headers, volk and slangc)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOWE_GPU=ON -DOWE_VIEWER=ON
      - name: Build
        run: cmake --build build
      - name: Devices
        run: build/owe backends || true
      - name: Tests (the conformance suite runs on gpu when the runner exposes a Metal device)
        run: ctest --test-dir build --output-on-failure
